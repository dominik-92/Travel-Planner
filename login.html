<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner - Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div class="auth-header">
        <h1 data-i18n="app.title">Travel Planner</h1>
        <p data-i18n="app.subtitle">Plan trips, manage itineraries, track budgets, and save destination notes.</p>
      </div>

      <div class="language-switcher">
        <select id="language-select" class="language-select">
          <option value="pl">Polski</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active" data-i18n="auth.loginTab">Login</button>
          <button id="tab-register" class="auth-tab" data-i18n="auth.registerTab">Create Account</button>
        </div>

        <div id="auth-error" class="auth-error hidden"></div>

        <form id="login-form" class="auth-form">
          <div class="field-group">
            <label for="login-username"><span data-i18n="auth.username">Username</span> <span class="required">*</span></label>
            <input id="login-username" name="username" type="text" data-i18n-placeholder="auth.usernamePlaceholder" placeholder="Your username" required />
          </div>
          <div class="field-group">
            <label for="login-password"><span data-i18n="auth.password">Password</span> <span class="required">*</span></label>
            <input id="login-password" name="password" type="password" data-i18n-placeholder="auth.passwordPlaceholder" placeholder="Your password" required />
          </div>
          <button type="submit" class="btn-primary btn-full" data-i18n="auth.loginButton">Login</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <div class="field-group">
            <label for="register-username"><span data-i18n="auth.username">Username</span> <span class="required">*</span></label>
            <input id="register-username" name="username" type="text" data-i18n-placeholder="auth.registerUsernamePlaceholder" placeholder="Choose a username" required />
          </div>
          <div class="field-group">
            <label for="register-email"><span data-i18n="auth.email">Email</span> <span class="required">*</span></label>
            <input id="register-email" name="email" type="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="your@email.com" required />
          </div>
          <div class="field-group">
            <label for="register-password"><span data-i18n="auth.password">Password</span> <span class="required">*</span></label>
            <input id="register-password" name="password" type="password" data-i18n-placeholder="auth.registerPasswordPlaceholder" placeholder="Choose a password" required />
          </div>
          <button type="submit" class="btn-primary btn-full" data-i18n="auth.registerButton">Create Account</button>
        </form>
      </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
