<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="forgot.title">Travel Planner - Forgot Password</title>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="css/styles.css?v=4" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div class="auth-brand">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
        </span>
        <h1 data-i18n="forgot.title">Forgot Password</h1>
      </div>
      <p class="auth-subtitle" data-i18n="forgot.subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="auth-top-actions">
        <div id="language-switch" class="lang-switch">
          <button type="button" class="lang-btn" data-lang="pl">PL</button>
          <span class="lang-sep">|</span>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <span class="lang-sep">|</span>
          <button type="button" class="lang-btn" data-lang="es">ES</button>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" data-theme-toggle data-i18n-title="theme.toggle" title="Toggle theme" aria-label="Toggle theme">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb">
              <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
              <svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
              </svg>
            </span>
          </span>
        </button>
      </div>

      <div class="auth-card">
        <div id="forgot-message" class="auth-error hidden"></div>

        <form id="forgot-form" class="auth-form">
          <div class="field-group">
            <label for="forgot-email"><span data-i18n="auth.email">Email</span> <span class="required">*</span></label>
            <input id="forgot-email" name="email" type="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="your@email.com" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full" data-i18n="forgot.send">Send Reset Link</button>
        </form>
      </div>

      <p class="auth-footer">
        <a href="login.html" data-i18n="forgot.backToLogin">Back to login</a>
      </p>
    </div>

    <script src="js/i18n.js?v=4"></script>
    <script src="js/theme.js?v=4"></script>
    <script src="js/forgot-password.js?v=4"></script>
  </body>
</html>
