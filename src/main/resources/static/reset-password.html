<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="reset.title">Travel Planner - Reset Password</title>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="css/styles.css?v=4" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div class="auth-brand">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
        </span>
        <h1 data-i18n="reset.title">Reset Password</h1>
      </div>
      <p class="auth-subtitle" data-i18n="reset.subtitle">Choose a new password.</p>

      <div class="auth-top-actions">
        <div id="language-switch" class="lang-switch">
          <button type="button" class="lang-btn" data-lang="pl">PL</button>
          <span class="lang-sep">|</span>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <span class="lang-sep">|</span>
          <button type="button" class="lang-btn" data-lang="es">ES</button>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" data-theme-toggle data-i18n-title="theme.toggle" title="Toggle theme" aria-label="Toggle theme">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb">
              <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
              <svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
              </svg>
            </span>
          </span>
        </button>
      </div>

      <div class="auth-card">
        <div id="reset-message" class="auth-error hidden"></div>

        <form id="reset-form" class="auth-form">
          <div class="field-group">
            <label for="new-password"><span data-i18n="reset.newPassword">New password</span> <span class="required">*</span></label>
            <div class="password-wrap">
              <input id="new-password" name="newPassword" type="password" data-i18n-placeholder="account.newPasswordPlaceholder" placeholder="Choose a new password" required />
              <button class="password-toggle" type="button" data-toggle-target="new-password" data-i18n-title="auth.showPassword" title="Show password" aria-label="Show password">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <div class="field-group">
            <label for="confirm-password"><span data-i18n="reset.confirmPassword">Confirm new password</span> <span class="required">*</span></label>
            <div class="password-wrap">
              <input id="confirm-password" name="confirmPassword" type="password" data-i18n-placeholder="account.confirmPasswordPlaceholder" placeholder="Repeat the new password" required />
              <button class="password-toggle" type="button" data-toggle-target="confirm-password" data-i18n-title="auth.showPassword" title="Show password" aria-label="Show password">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" data-i18n="reset.submit">Reset Password</button>
        </form>
      </div>

      <p class="auth-footer">
        <a href="login.html" data-i18n="reset.backToLogin">Back to login</a>
      </p>
    </div>

    <script src="js/i18n.js?v=4"></script>
    <script src="js/theme.js?v=4"></script>
    <script src="js/reset-password.js?v=4"></script>
  </body>
</html>
